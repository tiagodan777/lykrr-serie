<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar e Editar Receita</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width: 1100px)">
    <link rel="stylesheet" href="estilos/create-edit-article.css">
    <link rel="stylesheet" href="estilos/create-edit-article-desktop.css" media="screen and (min-width: 1100px)">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <header id="cabecalho-principal">
        <h1>
            <a href="#">
                <picture>
                    <source media="(max-width: 600px)" srcset="imagens/logos/logo-p.png" width="80px">
                    <source media="(max-width: 900px)" srcset="imagens/logos/logo-m.png" width="100px">
                    <img src="imagens/logos/logo-m.png" alt="Logo do Lykrr" width="130px">
                </picture>
            </a>
        </h1>
        <form action="#" method="get">
            <input type="search" name="pesquisa" id="pesquisa" placeholder="Pesquisa">
            <input type="submit" value="Pesquisar">
        </form>
        <div>
            <a href="#" id="chef_hat"><span class="material-symbols-outlined">chef_hat</span></a>
            <a href="#" id="add_box"><span class="material-symbols-outlined">add_box</span></a>
            <a href="#"><img src="imagens/fotos-perfil/tiago-p.png" alt="Foto de perfil de Tiago Daniel"></a>
        </div>
    </header>

    <main id="create-edit-article">
        <h1>Criar e Editar Receita 🧑🏻‍🍳</h1>
        <div id="opcoes-publicacao">
            <a href="#" class="pagina-atual">Receita</a>
            <a href="#">Foto</a>
            <a href="#">Quik</a>
            <a href="#">Vídeo Longo</a>
        </div>
        <form action="#" method="post" enctype="multipart/form-data">
            <section id="imagem-video">
                <div id="div-imagem">
                    <div>
                        <label for="imagem">Upload de Foto</label>
                        <input type="file" name="imagem" id="imagem">
                    </div>
                </div>
                <div id="div-video">
                    <div>
                        <label for="video">Upload de Foto</label>
                        <input type="file" name="video" id="video">
                    </div>
                </div>
            </section>

            <section id="info-texto">
                <div id="div-titulo">
                    <label for="titulo">Título</label>
                    <input type="text" name="titulo" id="titulo" required placeholder="Ex: Sushi, Bacalheu de Natas, Hambúrger À Las Vegas, ..." maxlength="64">
                </div>
                <div id="div-descricao">
                    <label for="descricao">Descrição</label>
                    <input type="text" name="descricao" id="descricao" placeholder="Como fazer o melhor Açaí da tua vida, ..." maxlength="256">
                </div>
                <div id="div-tempo-preparo">
                    <label for="tempo-preparo">Tempo de Preparo</label>
                    <div id="tempo-unidade">
                        <input type="number" name="tempo-preparo" id="tempo-preparo" min="0" placeholder="Ex: 45">
                        <select name="unidade-tempo" id="unidade-tempo">
                            <optgroup label="Unidade">
                                <option value="min">Min</option>
                                <option value="hr">Hora</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div id="div-numero-pessoas">
                    <label for="numeros-pessoas">Nº de Pessoas</label>
                    <select name="numeros-pessoas" id="numero-pessoas">
                        <script>
                            let select = window.document.querySelector('select#numero-pessoas');
                            for (let i = 1; i <= 16; i++) {
                                let option = window.document.createElement('option');
                                option.value = i;
                                option.innerHTML = i;
                                select.appendChild(option);
                            }
                        </script>
                    </select>
                </div>
                <div id="div-categoria">
                    <label for="categoria-id">Categoria</label>
                    <select name="categoria-id" id="categoria-id">
                        <option value="1">Carne 🥩</option>
                        <option value="2">Peixe 🐟</option>
                        <option value="3">Japonês 🍣</option>
                        <option value="4">Vegetariano 🥗</option>
                        <option value="5">Bebidas 🍸</option>
                    </select>
                </div>
                <div id="div-ingredientes">
                    <div id="labels-ingredientes-quantidades">
                        <span>Ingredientes</span>
                        <span>Quantidades</span>
                    </div>
                    <div class="ingredientes-quantidades">
                        <div class="inputs-ingredientes-quantidades">
                            <input type="text" name="ingrediente" id="ingrediente" placeholder="Ex: Salmão" minlength="0" maxlength="32">
                            <input type="text" name="quantidade" id="quantidade" placeholder="Ex: 200g, 500ml, 2 colheres, ..." minlength="0" maxlength="32">
                        </div>
                    </div>
                    <input type="button" value="Adicionar Ingrediente">
                </div>
                <div id="div-temperos">
                    <div id="labels-temperos-quantidades">
                        <span>Temperos</span>
                        <span>Quantidades</span>
                    </div>
                    <div class="temperos-quantidades">
                        <div class="inputs-temperos-quantidades">
                            <input type="text" name="tempero" id="tempero" placeholder="Ex: Sal, Louro, Açafrão das Índias" minlength="0" maxlength="32">
                            <input type="text" name="tempero-quantidade" id="tempero-quantidade" placeholder="Ex: 20g, 2 cholheres de chá, ...">
                        </div>
                    </div>
                    <input type="button" value="Adicionar Tempero">
                </div>
                <div id="div-passos-preparacao">
                    <div id="label-passos-preparacao">
                        <span>Passos de Preparação</span>
                    </div>
                    <div class="textareas-passos-preparacao">
                        <label for="passo">Passo</label>
                        <textarea name="passo" id="passo" cols="40" rows="7"></textarea>
                    </div>
                    <input type="button" value="Adicionar Passo">
                </div>
                <div id="div-tags">
                    <div id="labels-tags">
                        <span>Keywords / Tags</span>
                    </div>
                    <div class="inputs-tags">
                        <label for="tag">Tag</label>
                        <input type="text" name="tag" id="tag" placeholder="Ex: #sushi">
                    </div>
                    <input type="button" value="Adicionar Tag">
                </div>
                <section id="acoes">
                    <a href="#">Apagar</a>
                    <input type="submit" value="Publicar">
                </section>
            </section>
        </form>
    </main>

    <aside class="menu">
        <a href="#" class="ativo"><span class="material-symbols-outlined">home</span> <span class="descricao-icone">Página Principal</span></a>
        <a href=""><span class="material-symbols-outlined">chef_hat</span> <span class="descricao-icone">As Minhas Coisas</span></a>
        <a href=""><span class="material-symbols-outlined">bolt</span> <span class="descricao-icone">Quiks</span></a>
    </aside>
    <footer class="menu">
        <a href="#"><span class="material-symbols-outlined">home</span></a>
        <a href="#" class="ativo"><span class="material-symbols-outlined">add_box</span></a>
        <a href="#"><span class="material-symbols-outlined">bolt</span></a>
        <a href="#"><span class="material-symbols-outlined">search</span></a>
    </footer>
</body>
</html>
